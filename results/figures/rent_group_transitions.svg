<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Rent group persistence between adjacent years, 1970 to 2021</title>
<desc id="desc">Among 4351 adjacent-year pairs where both years are in the low or high rent groups, 4093 or 94.07 percent stay in the same tail and 258 or 5.93 percent switch tails.</desc>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d">Rent-group persistence, 1970–2021</text>
<text x="450" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#4b5563">Adjacent complete-year pairs with both years in the low/high tails (n = 4,351)</text>
<text x="100" y="150" font-family="Arial,sans-serif" font-size="16" fill="#374151">Stayed in same low/high group</text>
<text x="100" y="203" font-family="Arial,sans-serif" font-size="15" fill="#6b7280">4,093 of 4,351</text>
<text x="100" y="273" font-family="Arial,sans-serif" font-size="16" fill="#374151">Switched between low and high</text>
<text x="100" y="326" font-family="Arial,sans-serif" font-size="15" fill="#6b7280">258 of 4,351</text>
<rect x="380" y="125" width="440" height="42" rx="8" fill="#e5e7eb"/>
<rect x="380" y="125" width="413.9094461043439" height="42" rx="8" fill="#2563a6"/>
<text x="586.954723052172" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">94.07% stayed</text>
<rect x="380" y="248" width="440" height="42" rx="8" fill="#e5e7eb"/>
<rect x="380" y="248" width="26.09055389565617" height="42" rx="8" fill="#ed8936"/>
<text x="418.09055389565617" y="277" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#a94f08">5.93% switched</text>
<line x1="380" y1="350" x2="820" y2="350" stroke="#9ca3af"/>
<text x="380" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">0%</text>
<text x="600" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">50%</text>
<text x="820" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">100%</text>
<text x="450" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#6b7280">Middle-group observations are excluded from this two-tail rate.</text>
</svg>